[project]
name = "spellbook"
version = "0.3.2"
description = "Per-agent self-custodied wallets: a local non-LLM policy daemon plus the agent client library."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "awizardxch", email = "awizard.agent@gmail.com" }]
keywords = ["wallet", "agent", "chia", "evm", "custody"]
# f-03: crypto dependencies are PINNED to exact versions. A supply-chain
# swap in any of these lands directly in signing code, so every bump must
# be audited before it ships. requirements-lock.txt carries the SHA256
# hashes; install with `pip install --require-hashes -r requirements-lock.txt`.
dependencies = [
    "coincurve==21.0.0",      # secp256k1 (libsecp256k1 bindings) — key derivation + ECDSA
    "py_ecc==8.0.0",          # BLS12-381 — Chia master-key derivation + BLS signatures
    "blspy==2.0.3",           # Chia BLS (AugSchemeMPL) — chia_sign / stdkeys imports
    "pycryptodome==3.23.0",   # Keccak-256 — EVM addresses
    "pynacl==1.6.2",          # Ed25519 — identity signing behind the S1 gate
    "solders==0.29.0",        # Solana — Ed25519 keypairs, transaction build/sign (no relay needed)
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "eth-keys>=0.7.0",  # independent ECDSA cross-check in tests/test_evm.py
    "eth-abi>=5.0.0",  # independent ABI cross-check in tests/test_contract.py
    "eth-account>=0.13.0",  # EIP-191/712 cross-check in tests/test_message_sign.py
]

[project.scripts]
spellbookd = "spellbook.daemon:main"
spellbook = "spellbook.cli:main"
spellbook-seed = "spellbook.sealed:main"
spellbook-mcp = "spellbook.mcp_server:main"
spellbook-ceremony = "spellbook.ceremony:main"
spellbook-asset-index = "spellbook.asset_index:main"

[project.urls]
Homepage = "https://github.com/awizardxch/Spellbook"
Specification = "https://github.com/awizardxch/Spellbook/blob/main/SPEC_V1.md"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spellbook = ["bip39-english.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -rs: list skipped tests with their reason in the summary, so a skipped
# simulator verification (tests/test_chia_sim.py without chia-blockchain)
# is never silent.
addopts = "-rs"
